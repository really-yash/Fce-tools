name: Heavy ROM Task Worker

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Task action (import_vault, unpack, pack_single, pack_super, pack_zstd, convert)'
        required: true
      username:
        description: 'DNA Username'
        required: true
        default: 'guest'
      project:
        description: 'Target project name'
        required: true
        default: 'Default_Project'
      target_file:
        description: 'Target filename(s) or partition'
        required: true
      options:
        description: 'JSON encoded options'
        required: false
        default: '{}'

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ROM Filesystem Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y erofs-utils e2fsprogs f2fs-tools android-sdk-libsparse-utils p7zip-full brotli zstd curl

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir fastapi uvicorn python-multipart huggingface_hub "requests[socks]" PySocks stem brotli remotezip zstandard stream-unzip

      - name: Execute Heavy ROM Task on 7GB Runner
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATASET_REPO: ${{ secrets.DATASET_REPO }}
          TASK_ACTION: ${{ github.event.inputs.action }}
          TASK_USER: ${{ github.event.inputs.username }}
          TASK_PROJECT: ${{ github.event.inputs.project }}
          TASK_FILE: ${{ github.event.inputs.target_file }}
          TASK_OPTIONS: ${{ github.event.inputs.options }}
        run: |
          python worker_runner.py
